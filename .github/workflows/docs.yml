# Build the MkDocs tutorial from main and publish it to the current repository's
# `webpage` branch under docs/.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build (fails on broken links or anchors)
        env:
          MPB_DOCS_URL: ${{ vars.MPB_DOCS_URL || format('https://{0}.github.io/{1}/docs/', github.repository_owner, github.event.repository.name) }}
          MPB_CODE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: mkdocs build --strict -f docs/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/_site"

      - name: Publish to webpage:/docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: webpage
          publish_dir: ./_site
          destination_dir: docs
          keep_files: false   # with destination_dir set, only docs/ is replaced
          commit_message: "docs: publish from ${{ github.sha }}"
